name: Daily Collect

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python3 pipeline/pipeline.py --sources github,rss --limit 20 --verbose

      - name: Quality check
        continue-on-error: true
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          shopt -s nullglob
          files=(knowledge/articles/${TODAY}-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "今日（${TODAY}）无新 article，跳过质量校验"
            exit 0
          fi
          echo "审计今日 ${#files[@]} 篇新文章质量："
          python3 hooks/check_quality.py knowledge/articles/${TODAY}-*.json || true

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/
          if git diff --cached --quiet; then
            echo "无新数据，跳过提交"
            exit 0
          fi
          COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore(knowledge): 采集 ${DATE} 数据（${COUNT} 个文件变更）"
          git push
